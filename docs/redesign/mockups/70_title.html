<style>
/* Title screen: the strip itself, 600×160, with the party standing where the game will pick them up. */
.gm-ts { width: 600px; height: 160px; background: url(img/icons/title_backdrop.png); box-shadow: 0 0 0 1px var(--k0), 2px 2px 0 1px rgba(11, 13, 23, .55); }
.gm-ts > canvas { position: absolute; top: 59px; width: 96px; height: 70px; }
.gm-ts-fore { position: absolute; left: 0; top: 0; pointer-events: none; }
.gm-ts-logo { position: absolute; left: 321px; top: 9px; }

/* Everything that can be pressed sits in one row on the calm grass: three signs, then the one gold key. */
.gm-ts-menu { position: absolute; right: 8px; bottom: 5px; display: flex; align-items: center; gap: 2px; }
.gm-ts-play { position: relative; height: 24px; margin-left: 5px; border: 4px solid transparent; border-image: url(img/icons/ui_btn_gold.png) 4 fill / 4px / 0 stretch;
  display: flex; align-items: center; gap: 1px; padding: 0 7px 1px 0; font: 12px/12px var(--f-name); color: var(--gold-dk); white-space: nowrap; }
.gm-ts-play > img { margin-top: -1px; }
.gm-ts-play:hover { filter: brightness(1.12); }
.gm-ts-menu .tt.above { bottom: calc(100% + 5px); }
.gm-ts-party { display: flex; align-items: center; gap: 2px; padding-top: 3px; color: var(--k9); }
.gm-ts-party > img + img { margin-left: 4px; }
</style>

<div class="gm" role="group" aria-label="Maqueta de la pantalla de título: la tira del juego con el mundo 1 al atardecer, los tres héroes, el logotipo Taskbar Legion y la tecla para continuar.">
