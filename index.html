<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskbar Legion</title>
    <style>
      /* v1 is a NORMAL OPAQUE PAGE (SPEC §0.5). No transparency / click-through — those are v1.5.
         Pixel-art must stay crisp at every zoom. */
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #14121a;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        overflow: hidden;
      }
      #root {
        height: 100vh;
      }
      canvas {
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
